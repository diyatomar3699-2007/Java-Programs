<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page t</title>
</head>
<body>
    <form>
    <div>
    <label for="name">NAME</label>
    <input type="text"id="name"name="name" required="required"placeholder="enter your name">
    </div><br><br>
    <div>
    <label for="email">EMAIL ADDRESS</label>
    <input type="email"id="email"name="email" required="required"placeholder="enter email">
    </div><br><br>
    <div>
    <label for="phone number">PHONE NUMBER</label>
    <input type="contact"id="phone number" name="phone number"required="required"placeholder="enter phone number">
    </div><br><br>
    <div>
    <label for="password">PASSWORD</label>
    <input type="password"id="password" name="password"required="required"placeholder="enter password">
    </div><br><br>
    <button type="submit">LOGIN<button> 
    </form>
</body>
</html>
